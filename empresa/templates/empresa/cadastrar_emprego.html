{% extends 'core/base_empresa.html' %}
{% load static %}

{% block title %}WorkConnect | Vagas{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'empresa/css/cadastrar_emprego.css' %}">
<title>WorkConnect - Cadastra Vaga</title>



<div class="main-content">

    <section class="top-banner">
        <div class="banner-text">
            <h2>Cadastre sua oferta de vaga aqui!</h2>
            <p>Descreva a seguir as informações sobre a vaga que deseja ofertar</p>
        </div>
        <div class="banner-img">
            <img src="{% static 'core/img/banner-img.png' %}" alt="img-banner">
        </div>
    </section>

    <section class="form-container">
        <h3 class="title">Vamos lá!</h3>

     <div class="tabs">
    <button class="tab active"
            onclick="window.location.href='{% url 'empresa:cadastrar_emprego' %}'">
        Emprego
    </button>

    <button class="tab-other"
            onclick="window.location.href='{% url 'empresa:cadastrar_estagio' %}'">
        Estágio
    </button>
</div>


<form method="post" action="{% url 'empresa:cadastrar_emprego' %}" class="job-form">
    {% csrf_token%}

            <div class="form-row">
                <div class="form-group">
                    <label for="titulo">Titulo da vaga*</label>
                    <input type="text" name='titulo'id="titulo" placeholder="Ex: Vendedor">
                </div>

                <div class="form-group">
                    <label>Quantidade de vagas</label>
                    <input type="number" name='quantidade' id="quantidade" min="0" placeholder="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group largura_total">
                    <label for="Requisitos">Requisitos e qualificações*</label>
                    <textarea name='requisitos' id="Requisitos" placeholder="Click 'Enter' a cada requisito"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Modelo de Trabalho</label>
                   <select name="modelo_trabalho">
                    <option value="">Selecione</option>
                     <option value="presencial">Presencial</option>
                    <option value="hibrido">Híbrido</option>
                    <option value="remoto">Remoto</option>
                </select>

                </div>

                <div class="form-group">
                    <label>Faixa Salarial</label>
                   <input type="number" step="0.01" name="faixa_salarial" placeholder="0.00">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Tipo de contrato</label>
                   <select name="tipo_contrato">
                     <option value="">Selecione</option>
                     <option value="clt">CLT</option>
                     <option value="pj">PJ</option>
                    <option value="temporario">Temporário</option>
                    </select>

                </div>

                <div class="form-group">
                    <label>Jornada de Trabalho</label>
                    <input type="text" name='jornada' id="jornada" placeholder="Ex: 8h diárias">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Benefícios</label>
                    <div class="check-box">
                        <label>
                            <input type="checkbox" value="vale_refeicao"> Vale-refeição 
                        </label>
                        <label>
                            <input type="checkbox" name='plano_saude'value="plano_saude"> Plano de Saúde
                        </label>
                        <label>
                            <input type="checkbox" name='vale_transporte' value="vale_transporte"> Vale-transporte
                        </label>
                        <label>
                           <input type="checkbox" name="outros_beneficios">

                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Diferencial (Não obrigatório)</label>
                    <input type="text" name='diferencial'id="Diferencial">
                </div>
            </div>

            <div class="form-group full-width">
                <label>Descrição</label>
                <textarea name='descricao' id="descricao"></textarea>
            </div>

            <div class="button">
                <button type="submit">Cadastrar</button>
            </div>

        </form>
    </section>

</div>

{% endblock %}
